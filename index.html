<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17133b" />
    <meta name="description" content="3秒で違うものを見つける瞬間判断ゲーム" />
    <title>3秒で見つけろ！</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGEK6JWYC3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-HGEK6JWYC3");
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <p class="eyebrow">3秒ゲーム</p>
        <h1>3秒で見つけろ！</h1>
      </header>

      <section class="hud" aria-label="ゲーム情報">
        <div class="score-box"><span>SCORE</span><strong id="score">0</strong></div>
        <div class="timer-box"><span id="timer-label">のこり</span><strong id="timer">3.00</strong><i aria-hidden="true"></i></div>
      </section>

      <section id="game-stage" class="game-stage" aria-live="polite">
        <div class="start-card" id="start-screen">
          <p class="start-mark">!</p>
          <h2>ちがうものを<br />3秒でタップ！</h2>
          <p>正解するほど、どんどん難しくなる。</p>
          <button class="primary-button" id="start-button" type="button">ゲームスタート</button>
        </div>
        <div id="grid" class="icon-grid" hidden aria-label="問題"></div>
      </section>

      <p id="message" class="message">同じものの中から、ひとつだけ違うものを探そう</p>

      <section id="game-over" class="game-over" hidden aria-live="assertive">
        <p class="over-label">GAME OVER</p>
        <p id="result-reason" class="result-reason">タイムアップ！</p>
        <p class="result-score">あなたの記録：<strong id="final-score">0</strong>問</p>
        <p class="best-score">BEST：<strong id="best-score">0</strong>問</p>
        <p id="new-record" class="new-record" hidden>NEW RECORD!</p>
        <p id="streak-message" class="streak-message">次は自己ベストを更新しよう！</p>
        <button class="primary-button replay-button" id="replay-button" type="button">もう一度挑戦</button>
        <div class="future-slot" aria-label="将来の広告・共有機能用領域">広告・SNS共有は近日追加</div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
